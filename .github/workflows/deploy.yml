name: Deploy VM Infrastructure

on:
  push:
    branches: [ "main", "terraform_vm_deployment" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Check Allowed Azure Regions
        run: |
          echo "Checking allowed regions for your subscription..."
          az account list-locations --query "[].{Name:name, DisplayName:displayName}" -o table

          echo ""
          echo "Existing Resource Group location:"
          az group show --name Partfiniti-AI --query location -o tsv || echo "Resource group doesn't exist yet"

      - name: Terraform Init
        run: terraform init

      - name: Import Existing Resources (if any)
        run: |
          set +e

          # Import Resource Group
          terraform import azurerm_resource_group.rg \
            /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/Partfiniti-AI || true

          # Check if Key Vault exists and import
          KV_NAME=$(az keyvault list --resource-group Partfiniti-AI --query "[0].name" -o tsv 2>/dev/null || echo "")
          if [ ! -z "$KV_NAME" ]; then
            echo "Found existing Key Vault: $KV_NAME"
            terraform import azurerm_key_vault.kv \
              /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/Partfiniti-AI/providers/Microsoft.KeyVault/vaults/$KV_NAME || true
          fi

          # Import VNet
          terraform import azurerm_virtual_network.vnet \
            /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/Partfiniti-AI/providers/Microsoft.Network/virtualNetworks/Partfiniti-AI-vnet || true

          # Import Subnet
          terraform import azurerm_subnet.subnet \
            /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/Partfiniti-AI/providers/Microsoft.Network/virtualNetworks/Partfiniti-AI-vnet/subnets/default || true

          # Import NSG
          terraform import azurerm_network_security_group.nsg \
            /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/Partfiniti-AI/providers/Microsoft.Network/networkSecurityGroups/LLM-staging-nsg || true

          # Import Public IP
          terraform import azurerm_public_ip.pip \
            /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/Partfiniti-AI/providers/Microsoft.Network/publicIPAddresses/LLM-staging-ip || true

          # Import NIC
          terraform import azurerm_network_interface.nic \
            /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/Partfiniti-AI/providers/Microsoft.Network/networkInterfaces/llm-staging-nic || true

          # Import VM
          terraform import azurerm_linux_virtual_machine.vm \
            /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/Partfiniti-AI/providers/Microsoft.Compute/virtualMachines/LLM-staging || true

          set -e
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Get Terraform Outputs
        id: tf_outputs
        run: |
          VM_IP=$(terraform output -raw vm_public_ip)
          KV_NAME=$(terraform output -raw key_vault_name)
          SSH_SECRET=$(terraform output -raw ssh_private_key_secret_name)

          echo "vm_ip=$VM_IP" >> $GITHUB_ENV
          echo "kv_name=$KV_NAME" >> $GITHUB_ENV
          echo "ssh_secret_name=$SSH_SECRET" >> $GITHUB_ENV

          echo "### Deployment Complete! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**VM Public IP:** \`$VM_IP\`" >> $GITHUB_STEP_SUMMARY
          echo "**Key Vault Name:** \`$KV_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "**SSH Key Secret:** \`$SSH_SECRET\`" >> $GITHUB_STEP_SUMMARY

      - name: Retrieve SSH Private Key from Key Vault
        run: |
          echo "Retrieving SSH private key from Key Vault..."
          az keyvault secret show \
            --vault-name ${{ env.kv_name }} \
            --name ${{ env.ssh_secret_name }} \
            --query value -o tsv > ~/.ssh/llm_staging_key

          chmod 600 ~/.ssh/llm_staging_key
          echo "SSH private key saved to ~/.ssh/llm_staging_key"

      - name: Test SSH Connection
        run: |
          echo "Testing SSH connection to VM..."
          ssh-keyscan -H ${{ env.vm_ip }} >> ~/.ssh/known_hosts 2>/dev/null

          # Test connection
          ssh -i ~/.ssh/llm_staging_key -o StrictHostKeyChecking=no azureuser@${{ env.vm_ip }} "echo 'SSH connection successful!'"

      - name: Display Connection Information
        run: |
          echo "============================================"
          echo "VM Connection Information"
          echo "============================================"
          echo ""
          echo "Public IP: ${{ env.vm_ip }}"
          echo "Username: azureuser"
          echo "Key Vault: ${{ env.kv_name }}"
          echo ""
          echo "To connect to your VM:"
          echo "1. Retrieve SSH key:"
          echo "   az keyvault secret show --vault-name ${{ env.kv_name }} --name ${{ env.ssh_secret_name }} --query value -o tsv > ~/.ssh/llm_staging_key"
          echo "   chmod 600 ~/.ssh/llm_staging_key"
          echo ""
          echo "2. Connect via SSH:"
          echo "   ssh -i ~/.ssh/llm_staging_key azureuser@${{ env.vm_ip }}"
          echo ""
          echo "To retrieve application secret:"
          echo "   az keyvault secret show --vault-name ${{ env.kv_name }} --name app-secret --query value -o tsv"
          echo "============================================"

          # Also save to GitHub Summary
          echo "## SSH Connection Instructions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# Retrieve SSH private key" >> $GITHUB_STEP_SUMMARY
          echo "az keyvault secret show --vault-name ${{ env.kv_name }} --name ${{ env.ssh_secret_name }} --query value -o tsv > ~/.ssh/llm_staging_key" >> $GITHUB_STEP_SUMMARY
          echo "chmod 600 ~/.ssh/llm_staging_key" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Connect to VM" >> $GITHUB_STEP_SUMMARY
          echo "ssh -i ~/.ssh/llm_staging_key azureuser@${{ env.vm_ip }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Setup and Deploy Application (Optional)
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-app]')
        run: |
          echo "Deploying application to VM..."

          ssh -i ~/.ssh/llm_staging_key azureuser@${{ env.vm_ip }} << 'EOF'
            # Update system
            sudo apt update -y
            sudo apt install -y python3 python3-pip git screen curl jq

            # Install Azure CLI
            curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

            # Get access token using managed identity
            ACCESS_TOKEN=$(curl -s -H "Metadata: true" \
              "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://vault.azure.net/" \
              | jq -r '.access_token')

            # Get secret from Key Vault
            SECRET_VALUE=$(curl -s -H "Authorization: Bearer $ACCESS_TOKEN" \
              "https://${{ env.kv_name }}.vault.azure.net/secrets/app-secret?api-version=2016-10-01" \
              | jq -r '.value')

            # Clone repository
            cd /home/azureuser
            if [ -d "git_terraform" ]; then
              cd git_terraform
              git pull
            else
              git clone https://github.com/ZainabZaman/git_terraform.git
              cd git_terraform
            fi

            # Create .env file
            echo "MY_SECRET=$SECRET_VALUE" > .env

            # Install dependencies
            pip3 install fastapi uvicorn python-dotenv

            # Kill existing session if running
            screen -X -S fastapi_session quit 2>/dev/null || true

            # Start FastAPI in screen session
            screen -dmS fastapi_session bash -c 'cd /home/azureuser/git_terraform && python3 -m uvicorn main:app --host 0.0.0.0 --port 8000'

            echo "Application deployed successfully!"
          EOF

          echo "Application should be available at: http://${{ env.vm_ip }}:8000"