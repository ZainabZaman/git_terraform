name: Deploy FastAPI to VM

on:
  push:
    branches: [ "terraform_vm_deployment" ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Generate SSH Key
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t rsa -b 4096 -f ~/.ssh/id_rsa -N ""
          cat ~/.ssh/id_rsa.pub

      - name: Terraform Init
        run: terraform init

      - name: Terraform Import Resource Group (if exists)
        run: |
          set +e
          terraform import azurerm_resource_group.rg \
            /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/terraform_test || true
          set -e
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Terraform Import Key Vault (if exists)
        run: |
          set +e
          terraform import azurerm_key_vault.kv \
            /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/terraform_test/providers/Microsoft.KeyVault/vaults/fastapikv123 || true
          set -e
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Terraform Import VM (if exists)
        run: |
          set +e
          terraform import azurerm_linux_virtual_machine.vm \
            /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/terraform_test/providers/Microsoft.Compute/virtualMachines/terraform-test || true
          set -e
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Terraform Plan
        run: terraform plan
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Get VM IP
        run: |
          VM_IP=$(terraform output -raw vm_public_ip)
          echo "VM_IP=$VM_IP" >> $GITHUB_ENV
          echo "VM IP: $VM_IP"

      - name: Wait for VM to be ready
        run: |
          echo "Waiting for VM to be ready..."
          sleep 60

      - name: Setup VM and Deploy FastAPI
        run: |
          # Add VM to known hosts
          ssh-keyscan -H $VM_IP >> ~/.ssh/known_hosts

          # Install Azure CLI and dependencies on VM
          ssh -i ~/.ssh/id_rsa azureuser@$VM_IP << 'EOF'
            # Update system
            sudo apt update -y
            sudo apt install -y python3 python3-pip git screen curl

            # Install Azure CLI
            curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

            # Login using VM's managed identity
            az login --identity

            # Create screen session
            screen -dmS terraform_test_screen

            # Clone repo and setup in screen
            screen -S terraform_test_screen -X stuff $'cd /home/azureuser\n'
            screen -S terraform_test_screen -X stuff $'git clone https://github.com/ZainabZaman/git_terraform.git\n'
            screen -S terraform_test_screen -X stuff $'cd git_terraform\n'

            # Get secret from Key Vault and create .env file
            SECRET_VALUE=$(az keyvault secret show --vault-name fastapikv123 --name new-secret --query value -o tsv)
            echo "MY_SECRET=$SECRET_VALUE" > .env

            # Install Python dependencies
            screen -S terraform_test_screen -X stuff $'pip3 install fastapi uvicorn python-dotenv\n'

            # Run FastAPI
            screen -S terraform_test_screen -X stuff $'python3 -c "
                import os
                from dotenv import load_dotenv
                load_dotenv()
                from main import app
                import uvicorn
                uvicorn.run(app, host=\"0.0.0.0\", port=8000)
                "\n'
                EOF

      - name: Verify Deployment
        run: |
          echo "FastAPI should be running at: http://$VM_IP:8000"
          echo "To connect to VM: ssh azureuser@$VM_IP"
          echo "To attach to screen: screen -r terraform_test_screen"