name: Deploy VM Infrastructure

on:
  push:
    branches: [ "terraform_basic" ]
  workflow_dispatch:
    inputs:
      destroy_existing:
        description: 'Destroy existing resources before deployment'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Check Allowed Azure Regions
        run: |
          echo "Checking current resource group locations..."

          # Check if old RG exists
          OLD_RG_LOCATION=$(az group show --name Partfiniti-AI --query location -o tsv 2>/dev/null || echo "")
          if [ ! -z "$OLD_RG_LOCATION" ]; then
            echo "Found OLD resource group 'Partfiniti-AI' in region: $OLD_RG_LOCATION"
            echo "AZURE_REGION=$OLD_RG_LOCATION" >> $GITHUB_ENV
          fi

          # Check if new RG exists
          NEW_RG_LOCATION=$(az group show --name Partfiniti-AI-RG --query location -o tsv 2>/dev/null || echo "")
          if [ ! -z "$NEW_RG_LOCATION" ]; then
            echo "Found NEW resource group 'Partfiniti-AI-RG' in region: $NEW_RG_LOCATION"
            echo "AZURE_REGION=$NEW_RG_LOCATION" >> $GITHUB_ENV
          fi

          # If neither exists, try to determine allowed region
          if [ -z "$OLD_RG_LOCATION" ] && [ -z "$NEW_RG_LOCATION" ]; then
            echo "No existing resource groups found. Will use eastasia as default."
            echo "AZURE_REGION=eastasia" >> $GITHUB_ENV
          fi

          echo "Selected Azure Region: $AZURE_REGION"

      - name: Clean Up Existing Deployments
        if: github.event.inputs.destroy_existing == 'true' || github.event_name == 'push'
        run: |
          echo "============================================"
          echo "Cleaning up existing resources..."
          echo "============================================"

          # Clean up OLD resource group (Partfiniti-AI)
          OLD_RG_NAME="Partfiniti-AI"
          if az group show --name $OLD_RG_NAME &>/dev/null; then
            echo "Found OLD resource group '$OLD_RG_NAME'. Deleting completely..."
            az group delete --name $OLD_RG_NAME --yes --no-wait
            echo "OLD resource group deletion initiated..."
            sleep 30
          fi

          # Clean up NEW resource group (Partfiniti-AI-RG)
          RG_NAME="Partfiniti-AI-RG"
          if az group show --name $RG_NAME &>/dev/null; then
            echo "Resource group '$RG_NAME' exists. Proceeding with cleanup..."

            # Delete VM first (if exists)
            echo "Deleting Virtual Machine (if exists)..."
            VM_EXISTS=$(az vm list -g $RG_NAME --query "[?name=='partfiniti-ai-vm'].name" -o tsv)
            if [ ! -z "$VM_EXISTS" ]; then
              echo "Found VM: partfiniti-ai-vm. Deleting..."
              az vm delete --resource-group $RG_NAME --name partfiniti-ai-vm --yes --no-wait
              echo "VM deletion initiated (running in background)..."
            else
              echo "No VM found named 'partfiniti-ai-vm'"
            fi

            # Wait a bit for VM deletion to start
            sleep 10

            # Delete Network Interface (if exists)
            echo "Deleting Network Interface (if exists)..."
            NIC_EXISTS=$(az network nic list -g $RG_NAME --query "[?name=='partfiniti-ai-vm-nic'].name" -o tsv)
            if [ ! -z "$NIC_EXISTS" ]; then
              echo "Found NIC: partfiniti-ai-vm-nic. Deleting..."
              az network nic delete --resource-group $RG_NAME --name partfiniti-ai-vm-nic --no-wait
            fi

            # Delete Public IP (if exists)
            echo "Deleting Public IP (if exists)..."
            PIP_EXISTS=$(az network public-ip list -g $RG_NAME --query "[?name=='partfiniti-ai-vm-pip'].name" -o tsv)
            if [ ! -z "$PIP_EXISTS" ]; then
              echo "Found Public IP: partfiniti-ai-vm-pip. Deleting..."
              az network public-ip delete --resource-group $RG_NAME --name partfiniti-ai-vm-pip --no-wait
            fi

            # Delete NSG Association and NSG (if exists)
            echo "Deleting Network Security Group (if exists)..."
            NSG_EXISTS=$(az network nsg list -g $RG_NAME --query "[?name=='partfiniti-ai-vm-nsg'].name" -o tsv)
            if [ ! -z "$NSG_EXISTS" ]; then
              echo "Found NSG: partfiniti-ai-vm-nsg. Deleting..."
              az network nsg delete --resource-group $RG_NAME --name partfiniti-ai-vm-nsg --no-wait
            fi

            # Delete Subnet (if exists and not in use)
            echo "Deleting Subnet (if exists)..."
            SUBNET_EXISTS=$(az network vnet subnet list -g $RG_NAME --vnet-name partfiniti-ai-vnet --query "[?name=='partfiniti-ai-subnet'].name" -o tsv 2>/dev/null || echo "")
            if [ ! -z "$SUBNET_EXISTS" ]; then
              echo "Found Subnet: partfiniti-ai-subnet. Will be deleted with VNet..."
            fi

            # Wait for network resources to be deleted
            echo "Waiting for network resources to be deleted (30 seconds)..."
            sleep 30

            # Delete VNet (if exists)
            echo "Deleting Virtual Network (if exists)..."
            VNET_EXISTS=$(az network vnet list -g $RG_NAME --query "[?name=='partfiniti-ai-vnet'].name" -o tsv)
            if [ ! -z "$VNET_EXISTS" ]; then
              echo "Found VNet: partfiniti-ai-vnet. Deleting..."
              az network vnet delete --resource-group $RG_NAME --name partfiniti-ai-vnet --no-wait
            fi

            # Delete Key Vault (if exists) - with purge protection handling
            echo "Deleting Key Vault (if exists)..."
            KV_LIST=$(az keyvault list -g $RG_NAME --query "[].name" -o tsv)
            for KV_NAME in $KV_LIST; do
              if [[ $KV_NAME == partfiniti-ai-kv-* ]]; then
                echo "Found Key Vault: $KV_NAME. Deleting..."
                az keyvault delete --name $KV_NAME --resource-group $RG_NAME --no-wait

                # Purge the key vault to allow recreation with same name
                echo "Purging Key Vault: $KV_NAME..."
                az keyvault purge --name $KV_NAME --no-wait 2>/dev/null || echo "Key Vault purge initiated or already purged"
              fi
            done

            echo ""
            echo "Waiting for all deletions to complete (60 seconds)..."
            sleep 60

            # Now delete the entire resource group to ensure clean slate
            echo "Deleting entire resource group for clean slate..."
            az group delete --name $RG_NAME --yes --no-wait

            # Wait for RG deletion
            echo "Waiting for resource group deletion (up to 2 minutes)..."
            for i in {1..24}; do
              if ! az group show --name $RG_NAME &>/dev/null; then
                echo "Resource group deleted successfully!"
                break
              fi
              echo "Still deleting... ($i/24)"
              sleep 5
            done

            echo ""
            echo "============================================"
            echo "Cleanup completed!"
            echo "============================================"
          else
            echo "Resource group '$RG_NAME' does not exist. Nothing to clean up."
          fi

      - name: Delete Resource Group (Optional - Full Clean)
        if: github.event.inputs.destroy_existing == 'true' && contains(github.event.head_commit.message, '[full-clean]')
        run: |
          echo "============================================"
          echo "FULL CLEAN: Deleting entire resource group..."
          echo "============================================"

          RG_NAME="Partfiniti-AI-RG"

          if az group show --name $RG_NAME &>/dev/null; then
            echo "Deleting resource group: $RG_NAME"
            az group delete --name $RG_NAME --yes --no-wait

            echo "Waiting for resource group deletion to complete..."
            # Wait for resource group to be deleted (max 5 minutes)
            for i in {1..30}; do
              if ! az group show --name $RG_NAME &>/dev/null; then
                echo "Resource group deleted successfully!"
                break
              fi
              echo "Still deleting... ($i/30)"
              sleep 10
            done
          else
            echo "Resource group does not exist."
          fi

      - name: Terraform Init
        run: terraform init

      - name: Import Existing Resources (if any)
        run: |
          set +e

          echo "Attempting to import any remaining resources..."

          # Import Resource Group (if exists)
          if az group show --name Partfiniti-AI-RG &>/dev/null; then
            echo "Found existing resource group, importing..."
            terraform import azurerm_resource_group.rg \
              /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/Partfiniti-AI-RG 2>/dev/null || true
          fi

          # Check if Key Vault exists and import
          KV_NAME=$(az keyvault list --resource-group Partfiniti-AI-RG --query "[0].name" -o tsv 2>/dev/null || echo "")
          if [ ! -z "$KV_NAME" ]; then
            echo "Found existing Key Vault: $KV_NAME"
            terraform import azurerm_key_vault.kv \
              /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/Partfiniti-AI-RG/providers/Microsoft.KeyVault/vaults/$KV_NAME 2>/dev/null || true
          fi

          # Import VNet
          terraform import azurerm_virtual_network.vnet \
            /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/Partfiniti-AI-RG/providers/Microsoft.Network/virtualNetworks/partfiniti-ai-vnet 2>/dev/null || true

          # Import Subnet
          terraform import azurerm_subnet.subnet \
            /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/Partfiniti-AI-RG/providers/Microsoft.Network/virtualNetworks/partfiniti-ai-vnet/subnets/partfiniti-ai-subnet 2>/dev/null || true

          # Import NSG
          terraform import azurerm_network_security_group.nsg \
            /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/Partfiniti-AI-RG/providers/Microsoft.Network/networkSecurityGroups/partfiniti-ai-vm-nsg 2>/dev/null || true

          # Import Public IP
          terraform import azurerm_public_ip.pip \
            /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/Partfiniti-AI-RG/providers/Microsoft.Network/publicIPAddresses/partfiniti-ai-vm-pip 2>/dev/null || true

          # Import NIC
          terraform import azurerm_network_interface.nic \
            /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/Partfiniti-AI-RG/providers/Microsoft.Network/networkInterfaces/partfiniti-ai-vm-nic 2>/dev/null || true

          # Import VM
          terraform import azurerm_linux_virtual_machine.vm \
            /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/Partfiniti-AI-RG/providers/Microsoft.Compute/virtualMachines/partfiniti-ai-vm 2>/dev/null || true

          set -e

          echo "Import phase completed."
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Get Terraform Outputs
        id: tf_outputs
        run: |
          VM_IP=$(terraform output -raw vm_public_ip)
          KV_NAME=$(terraform output -raw key_vault_name)
          SSH_SECRET=$(terraform output -raw ssh_private_key_secret_name)

          echo "vm_ip=$VM_IP" >> $GITHUB_ENV
          echo "kv_name=$KV_NAME" >> $GITHUB_ENV
          echo "ssh_secret_name=$SSH_SECRET" >> $GITHUB_ENV

          echo "### Deployment Complete! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**VM Public IP:** \`$VM_IP\`" >> $GITHUB_STEP_SUMMARY
          echo "**Key Vault Name:** \`$KV_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "**SSH Key Secret:** \`$SSH_SECRET\`" >> $GITHUB_STEP_SUMMARY

      - name: Retrieve SSH Private Key from Key Vault
        run: |
          echo "Retrieving SSH private key from Key Vault..."
          az keyvault secret show \
            --vault-name ${{ env.kv_name }} \
            --name ${{ env.ssh_secret_name }} \
            --query value -o tsv > ~/.ssh/partfiniti_ai_key

          chmod 600 ~/.ssh/partfiniti_ai_key
          echo "SSH private key saved to ~/.ssh/partfiniti_ai_key"

      - name: Test SSH Connection
        run: |
          echo "Testing SSH connection to VM..."
          ssh-keyscan -H ${{ env.vm_ip }} >> ~/.ssh/known_hosts 2>/dev/null

          # Test connection
          ssh -i ~/.ssh/partfiniti_ai_key -o StrictHostKeyChecking=no azureuser@${{ env.vm_ip }} "echo 'SSH connection successful!'"

      - name: Display Connection Information
        run: |
          echo "============================================"
          echo "VM Connection Information"
          echo "============================================"
          echo ""
          echo "Public IP: ${{ env.vm_ip }}"
          echo "Username: azureuser"
          echo "Key Vault: ${{ env.kv_name }}"
          echo ""
          echo "To connect to your VM:"
          echo "1. Retrieve SSH key:"
          echo "   az keyvault secret show --vault-name ${{ env.kv_name }} --name ${{ env.ssh_secret_name }} --query value -o tsv > ~/.ssh/partfiniti_ai_key"
          echo "   chmod 600 ~/.ssh/partfiniti_ai_key"
          echo ""
          echo "2. Connect via SSH:"
          echo "   ssh -i ~/.ssh/partfiniti_ai_key azureuser@${{ env.vm_ip }}"
          echo ""
          echo "To retrieve application secret:"
          echo "   az keyvault secret show --vault-name ${{ env.kv_name }} --name app-secret --query value -o tsv"
          echo "============================================"

          # Also save to GitHub Summary
          echo "## SSH Connection Instructions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# Retrieve SSH private key" >> $GITHUB_STEP_SUMMARY
          echo "az keyvault secret show --vault-name ${{ env.kv_name }} --name ${{ env.ssh_secret_name }} --query value -o tsv > ~/.ssh/partfiniti_ai_key" >> $GITHUB_STEP_SUMMARY
          echo "chmod 600 ~/.ssh/partfiniti_ai_key" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Connect to VM" >> $GITHUB_STEP_SUMMARY
          echo "ssh -i ~/.ssh/partfiniti_ai_key azureuser@${{ env.vm_ip }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Setup and Deploy Application (Optional)
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-app]')
        run: |
          echo "Deploying application to VM..."

          ssh -i ~/.ssh/partfiniti_ai_key azureuser@${{ env.vm_ip }} << 'EOF'
            # Update system
            sudo apt update -y
            sudo apt install -y python3 python3-pip git screen curl jq

            # Install Azure CLI
            curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

            # Get access token using managed identity
            ACCESS_TOKEN=$(curl -s -H "Metadata: true" \
              "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://vault.azure.net/" \
              | jq -r '.access_token')

            # Get secret from Key Vault
            SECRET_VALUE=$(curl -s -H "Authorization: Bearer $ACCESS_TOKEN" \
              "https://${{ env.kv_name }}.vault.azure.net/secrets/app-secret?api-version=2016-10-01" \
              | jq -r '.value')

            # Clone repository
            cd /home/azureuser
            if [ -d "git_terraform" ]; then
              cd git_terraform
              git pull
            else
              git clone https://github.com/ZainabZaman/git_terraform.git
              cd git_terraform
            fi

            # Create .env file
            echo "MY_SECRET=$SECRET_VALUE" > .env

            # Install dependencies
            pip3 install fastapi uvicorn python-dotenv

            # Kill existing session if running
            screen -X -S fastapi_session quit 2>/dev/null || true

            # Start FastAPI in screen session
            screen -dmS fastapi_session bash -c 'cd /home/azureuser/git_terraform && python3 -m uvicorn main:app --host 0.0.0.0 --port 8000'

            echo "Application deployed successfully!"
          EOF

          echo "Application should be available at: http://${{ env.vm_ip }}:8000"