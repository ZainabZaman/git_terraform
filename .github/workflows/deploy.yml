name: Deploy FastAPI

on:
  push:
    branches: [ "terraform_basic" ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Load VM Configuration
        id: load_config
        run: |
          # Read configuration from vm-config.json
          DEV_VM_NAME=$(jq -r '.dev.vm_name' vm-config.json)
          DEV_VM_SIZE=$(jq -r '.dev.vm_size' vm-config.json)
          DEV_VM_LOCATION=$(jq -r '.dev.vm_location' vm-config.json)

          STAGING_VM_NAME=$(jq -r '.staging.vm_name' vm-config.json)
          STAGING_VM_SIZE=$(jq -r '.staging.vm_size' vm-config.json)
          STAGING_VM_LOCATION=$(jq -r '.staging.vm_location' vm-config.json)

          PROD_VM_NAME=$(jq -r '.prod.vm_name' vm-config.json)
          PROD_VM_SIZE=$(jq -r '.prod.vm_size' vm-config.json)
          PROD_VM_LOCATION=$(jq -r '.prod.vm_location' vm-config.json)

          # Export to GITHUB_OUTPUT
          echo "dev_vm_name=$DEV_VM_NAME" >> $GITHUB_OUTPUT
          echo "dev_vm_size=$DEV_VM_SIZE" >> $GITHUB_OUTPUT
          echo "dev_vm_location=$DEV_VM_LOCATION" >> $GITHUB_OUTPUT

          echo "staging_vm_name=$STAGING_VM_NAME" >> $GITHUB_OUTPUT
          echo "staging_vm_size=$STAGING_VM_SIZE" >> $GITHUB_OUTPUT
          echo "staging_vm_location=$STAGING_VM_LOCATION" >> $GITHUB_OUTPUT

          echo "prod_vm_name=$PROD_VM_NAME" >> $GITHUB_OUTPUT
          echo "prod_vm_size=$PROD_VM_SIZE" >> $GITHUB_OUTPUT
          echo "prod_vm_location=$PROD_VM_LOCATION" >> $GITHUB_OUTPUT

          echo "VM Configuration loaded:"
          echo "Dev: $DEV_VM_NAME | $DEV_VM_SIZE | $DEV_VM_LOCATION"
          echo "Staging: $STAGING_VM_NAME | $STAGING_VM_SIZE | $STAGING_VM_LOCATION"
          echo "Production: $PROD_VM_NAME | $PROD_VM_SIZE | $PROD_VM_LOCATION"

      - name: Generate SSH Keys for All Environments
        run: |
          mkdir -p ~/.ssh

          # Generate SSH key for Dev
          ssh-keygen -t rsa -b 4096 -f ~/.ssh/id_rsa_dev -N "" -C "dev-environment"
          echo "Dev SSH Public Key:"
          cat ~/.ssh/id_rsa_dev.pub

          # Generate SSH key for Staging
          ssh-keygen -t rsa -b 4096 -f ~/.ssh/id_rsa_staging -N "" -C "staging-environment"
          echo "Staging SSH Public Key:"
          cat ~/.ssh/id_rsa_staging.pub

          # Generate SSH key for Production
          ssh-keygen -t rsa -b 4096 -f ~/.ssh/id_rsa_prod -N "" -C "production-environment"
          echo "Production SSH Public Key:"
          cat ~/.ssh/id_rsa_prod.pub

      - name: Create Terraform Variables File
        run: |
          cat > terraform.tfvars <<EOF
          dev_vm_name = "${{ steps.load_config.outputs.dev_vm_name }}"
          dev_vm_size = "${{ steps.load_config.outputs.dev_vm_size }}"
          dev_vm_location = "${{ steps.load_config.outputs.dev_vm_location }}"

          staging_vm_name = "${{ steps.load_config.outputs.staging_vm_name }}"
          staging_vm_size = "${{ steps.load_config.outputs.staging_vm_size }}"
          staging_vm_location = "${{ steps.load_config.outputs.staging_vm_location }}"

          prod_vm_name = "${{ steps.load_config.outputs.prod_vm_name }}"
          prod_vm_size = "${{ steps.load_config.outputs.prod_vm_size }}"
          prod_vm_location = "${{ steps.load_config.outputs.prod_vm_location }}"
          EOF

      - name: Terraform Init
        run: terraform init

      - name: Check if Resource Group exists
        id: check_rg
        run: |
          if az group show --name setup-infra &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Import Existing Resources
        run: |
          set +e  # Don't fail on import errors

          SUBSCRIPTION_ID="${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}"

          # Import Resource Group
          if [ "${{ steps.check_rg.outputs.exists }}" == "true" ]; then
            terraform import azurerm_resource_group.rg "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/setup-infra"
          fi

          # Import Key Vault
          if az keyvault show --name setup-infra-kv &>/dev/null; then
            terraform import azurerm_key_vault.kv "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/setup-infra/providers/Microsoft.KeyVault/vaults/setup-infra-kv"
          fi

          # Get Service Principal Object ID
          OBJECT_ID=$(az ad sp list --filter "appId eq '${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}'" --query "[].id" -o tsv)
          echo "SP_OBJECT_ID=$OBJECT_ID" >> $GITHUB_ENV

          # Import SP Access Policy
          if az keyvault show --name setup-infra-kv &>/dev/null; then
            terraform import azurerm_key_vault_access_policy.policy "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/setup-infra/providers/Microsoft.KeyVault/vaults/setup-infra-kv/objectId/$OBJECT_ID"
          fi

          # Import Network Security Groups
          for env in dev staging prod; do
            if az network nsg show --resource-group setup-infra --name fastapi-nsg-$env &>/dev/null; then
              terraform import "azurerm_network_security_group.nsg[\"$env\"]" "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/setup-infra/providers/Microsoft.Network/networkSecurityGroups/fastapi-nsg-$env"
            fi
          done

          # Import Virtual Networks
          for env in dev staging prod; do
            if az network vnet show --resource-group setup-infra --name fastapi-vnet-$env &>/dev/null; then
              terraform import "azurerm_virtual_network.vnet[\"$env\"]" "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/setup-infra/providers/Microsoft.Network/virtualNetworks/fastapi-vnet-$env"
            fi
          done

          # Import Subnets
          for env in dev staging prod; do
            if az network vnet subnet show --resource-group setup-infra --vnet-name fastapi-vnet-$env --name fastapi-subnet-$env &>/dev/null; then
              terraform import "azurerm_subnet.subnet[\"$env\"]" "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/setup-infra/providers/Microsoft.Network/virtualNetworks/fastapi-vnet-$env/subnets/fastapi-subnet-$env"
            fi
          done

          # Import NSG-Subnet Associations
          for env in dev staging prod; do
            SUBNET_ID="/subscriptions/$SUBSCRIPTION_ID/resourceGroups/setup-infra/providers/Microsoft.Network/virtualNetworks/fastapi-vnet-$env/subnets/fastapi-subnet-$env"
            if az network vnet subnet show --ids $SUBNET_ID &>/dev/null; then
              terraform import "azurerm_subnet_network_security_group_association.nsg_association[\"$env\"]" "$SUBNET_ID"
            fi
          done

          # Import Public IPs
          for env in dev staging prod; do
            if az network public-ip show --resource-group setup-infra --name fastapi-vm-ip-$env &>/dev/null; then
              terraform import "azurerm_public_ip.pip[\"$env\"]" "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/setup-infra/providers/Microsoft.Network/publicIPAddresses/fastapi-vm-ip-$env"
            fi
          done

          # Import Network Interfaces
          for env in dev staging prod; do
            if az network nic show --resource-group setup-infra --name fastapi-nic-$env &>/dev/null; then
              terraform import "azurerm_network_interface.nic[\"$env\"]" "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/setup-infra/providers/Microsoft.Network/networkInterfaces/fastapi-nic-$env"
            fi
          done

          # Import Virtual Machines
          for env in dev staging prod; do
            VM_NAME=$(jq -r ".$env.vm_name" vm-config.json)
            if az vm show --resource-group setup-infra --name $VM_NAME &>/dev/null; then
              terraform import "azurerm_linux_virtual_machine.vm[\"$env\"]" "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/setup-infra/providers/Microsoft.Compute/virtualMachines/$VM_NAME"

              # Import VM Key Vault Access Policy
              VM_PRINCIPAL_ID=$(az vm show --resource-group setup-infra --name $VM_NAME --query identity.principalId -o tsv)
              if [ ! -z "$VM_PRINCIPAL_ID" ]; then
                terraform import "azurerm_key_vault_access_policy.vm_policy[\"$env\"]" "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/setup-infra/providers/Microsoft.KeyVault/vaults/setup-infra-kv/objectId/$VM_PRINCIPAL_ID"
              fi
            fi
          done

          set -e
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Terraform Plan
        run: terraform plan
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Get VM Connection Details
        id: vm_details
        run: |
          echo "dev_vm_ip=$(terraform output -raw dev_vm_public_ip)" >> $GITHUB_OUTPUT
          echo "staging_vm_ip=$(terraform output -raw staging_vm_public_ip)" >> $GITHUB_OUTPUT
          echo "prod_vm_ip=$(terraform output -raw prod_vm_public_ip)" >> $GITHUB_OUTPUT

          echo "dev_vm_name=$(terraform output -raw dev_vm_name)" >> $GITHUB_OUTPUT
          echo "staging_vm_name=$(terraform output -raw staging_vm_name)" >> $GITHUB_OUTPUT
          echo "prod_vm_name=$(terraform output -raw prod_vm_name)" >> $GITHUB_OUTPUT

      - name: Prepare SSH Keys for Upload
        run: |
          mkdir -p ./ssh-keys

          # Dev SSH Key
          cp ~/.ssh/id_rsa_dev ./ssh-keys/dev_ssh_private_key.pem
          chmod 600 ./ssh-keys/dev_ssh_private_key.pem

          # Staging SSH Key
          cp ~/.ssh/id_rsa_staging ./ssh-keys/staging_ssh_private_key.pem
          chmod 600 ./ssh-keys/staging_ssh_private_key.pem

          # Production SSH Key
          cp ~/.ssh/id_rsa_prod ./ssh-keys/prod_ssh_private_key.pem
          chmod 600 ./ssh-keys/prod_ssh_private_key.pem

          # Create connection info file
          cat > ./ssh-keys/CONNECTION_INFO.txt <<EOF
          ================================================
          DEPLOYMENT CREDENTIALS - ALL ENVIRONMENTS
          ================================================

          ** DEVELOPMENT ENVIRONMENT **
          VM Name: ${{ steps.vm_details.outputs.dev_vm_name }}
          VM Size: ${{ steps.load_config.outputs.dev_vm_size }}
          Location: ${{ steps.load_config.outputs.dev_vm_location }}
          IP Address: ${{ steps.vm_details.outputs.dev_vm_ip }}
          Username: azureuser
          SSH Key: dev_ssh_private_key.pem
          SSH Command: ssh -i dev_ssh_private_key.pem azureuser@${{ steps.vm_details.outputs.dev_vm_ip }}

          ** STAGING ENVIRONMENT **
          VM Name: ${{ steps.vm_details.outputs.staging_vm_name }}
          VM Size: ${{ steps.load_config.outputs.staging_vm_size }}
          Location: ${{ steps.load_config.outputs.staging_vm_location }}
          IP Address: ${{ steps.vm_details.outputs.staging_vm_ip }}
          Username: azureuser
          SSH Key: staging_ssh_private_key.pem
          SSH Command: ssh -i staging_ssh_private_key.pem azureuser@${{ steps.vm_details.outputs.staging_vm_ip }}

          ** PRODUCTION ENVIRONMENT **
          VM Name: ${{ steps.vm_details.outputs.prod_vm_name }}
          VM Size: ${{ steps.load_config.outputs.prod_vm_size }}
          Location: ${{ steps.load_config.outputs.prod_vm_location }}
          IP Address: ${{ steps.vm_details.outputs.prod_vm_ip }}
          Username: azureuser
          SSH Key: prod_ssh_private_key.pem
          SSH Command: ssh -i prod_ssh_private_key.pem azureuser@${{ steps.vm_details.outputs.prod_vm_ip }}

          ** KEY VAULT **
          Name: setup-infra-kv
          Access: az keyvault secret show --vault-name setup-infra-kv --name <secret-name>

          ================================================
          EOF

      - name: Upload Development SSH Key
        uses: actions/upload-artifact@v4
        with:
          name: dev-ssh-credentials
          path: |
            ./ssh-keys/dev_ssh_private_key.pem
            ./ssh-keys/CONNECTION_INFO.txt
          retention-days: 7

      - name: Upload Staging SSH Key
        uses: actions/upload-artifact@v4
        with:
          name: staging-ssh-credentials
          path: |
            ./ssh-keys/staging_ssh_private_key.pem
            ./ssh-keys/CONNECTION_INFO.txt
          retention-days: 7

      - name: Upload Production SSH Key
        uses: actions/upload-artifact@v4
        with:
          name: prod-ssh-credentials
          path: |
            ./ssh-keys/prod_ssh_private_key.pem
            ./ssh-keys/CONNECTION_INFO.txt
          retention-days: 7

      - name: Display Deployment Summary
        run: |
          echo "================================================"
          echo "     MULTI-ENVIRONMENT DEPLOYMENT SUMMARY"
          echo "================================================"
          echo ""
          echo "✓ Development Environment:"
          echo "  VM: ${{ steps.vm_details.outputs.dev_vm_name }}"
          echo "  Size: ${{ steps.load_config.outputs.dev_vm_size }}"
          echo "  Location: ${{ steps.load_config.outputs.dev_vm_location }}"
          echo "  IP: ${{ steps.vm_details.outputs.dev_vm_ip }}"
          echo "  Connect: ssh -i dev_ssh_private_key.pem azureuser@${{ steps.vm_details.outputs.dev_vm_ip }}"
          echo ""
          echo "✓ Staging Environment:"
          echo "  VM: ${{ steps.vm_details.outputs.staging_vm_name }}"
          echo "  Size: ${{ steps.load_config.outputs.staging_vm_size }}"
          echo "  Location: ${{ steps.load_config.outputs.staging_vm_location }}"
          echo "  IP: ${{ steps.vm_details.outputs.staging_vm_ip }}"
          echo "  Connect: ssh -i staging_ssh_private_key.pem azureuser@${{ steps.vm_details.outputs.staging_vm_ip }}"
          echo ""
          echo "✓ Production Environment:"
          echo "  VM: ${{ steps.vm_details.outputs.prod_vm_name }}"
          echo "  Size: ${{ steps.load_config.outputs.prod_vm_size }}"
          echo "  Location: ${{ steps.load_config.outputs.prod_vm_location }}"
          echo "  IP: ${{ steps.vm_details.outputs.prod_vm_ip }}"
          echo "  Connect: ssh -i prod_ssh_private_key.pem azureuser@${{ steps.vm_details.outputs.prod_vm_ip }}"
          echo ""
          echo "📦 Download SSH keys from Actions > Artifacts"
          echo "================================================"