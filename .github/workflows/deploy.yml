name: Deploy VM Infrastructure

on:
  push:
    branches: [ "<YOUR_BRANCH_NAME>" ] # <-- UPDATE THIS TO YOUR BRANCH NAME
  workflow_dispatch:
    inputs:
      destroy_existing:
        description: 'Destroy existing resources before deployment'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Check Allowed Azure Regions
        run: |
          echo "Checking current resource group locations..."

          # Check if resource group exists
          RG_LOCATION=$(az group show --name partfiniti-AI --query location -o tsv 2>/dev/null || echo "")
          if [ ! -z "$RG_LOCATION" ]; then
            echo "Found resource group 'partfiniti-AI' in region: $RG_LOCATION"
            echo "AZURE_REGION=$RG_LOCATION" >> $GITHUB_ENV
          else
            echo "No existing resource group found. Will use eastasia as default."
            echo "AZURE_REGION=eastasia" >> $GITHUB_ENV
          fi

          echo "Selected Azure Region: $AZURE_REGION"

      - name: Clean Up Existing Deployments
        if: github.event.inputs.destroy_existing == 'true' || github.event_name == 'push'
        run: |
          echo "============================================"
          echo "Cleaning up existing resources..."
          echo "============================================"

          RG_NAME="partfiniti-AI"
          if az group show --name $RG_NAME &>/dev/null; then
            echo "Resource group '$RG_NAME' exists. Proceeding with cleanup..."

            # Step 1: Delete ALL VMs in the resource group
            echo "Deleting ALL Virtual Machines..."
            VM_LIST=$(az vm list -g $RG_NAME --query "[].name" -o tsv)
            if [ ! -z "$VM_LIST" ]; then
              for VM_NAME in $VM_LIST; do
                echo "Found VM: $VM_NAME. Deleting..."
                az vm delete --resource-group $RG_NAME --name $VM_NAME --yes
                echo "VM $VM_NAME deleted successfully!"
              done

              # Additional wait to ensure Azure backend updates
              echo "Waiting for Azure to update resource dependencies (20 seconds)..."
              sleep 20
            else
              echo "No VMs found in resource group"
            fi

            # Step 2: Disassociate NSGs from ALL NICs
            echo "Disassociating NSGs from all Network Interfaces..."
            NIC_LIST=$(az network nic list -g $RG_NAME --query "[].name" -o tsv)
            if [ ! -z "$NIC_LIST" ]; then
              for NIC_NAME in $NIC_LIST; do
                echo "Checking NIC: $NIC_NAME"
                NSG_ID=$(az network nic show -g $RG_NAME -n $NIC_NAME --query "networkSecurityGroup.id" -o tsv 2>/dev/null || echo "")
                if [ ! -z "$NSG_ID" ] && [ "$NSG_ID" != "null" ]; then
                  echo "  Disassociating NSG from NIC: $NIC_NAME"
                  az network nic update -g $RG_NAME -n $NIC_NAME --remove networkSecurityGroup 2>/dev/null || echo "  Already disassociated or error occurred"
                fi
              done
              echo "Waiting for NSG disassociation to complete (15 seconds)..."
              sleep 15
            fi

            # Step 3: Delete ALL Network Interfaces
            echo "Deleting ALL Network Interfaces..."
            NIC_LIST=$(az network nic list -g $RG_NAME --query "[].name" -o tsv)
            if [ ! -z "$NIC_LIST" ]; then
              for NIC_NAME in $NIC_LIST; do
                echo "Deleting NIC: $NIC_NAME"
                az network nic delete --resource-group $RG_NAME --name $NIC_NAME --no-wait
              done
              echo "NIC deletions initiated..."
            fi

            # Step 4: Delete ALL Public IPs
            echo "Deleting ALL Public IPs..."
            PIP_LIST=$(az network public-ip list -g $RG_NAME --query "[].name" -o tsv)
            if [ ! -z "$PIP_LIST" ]; then
              for PIP_NAME in $PIP_LIST; do
                echo "Deleting Public IP: $PIP_NAME"
                az network public-ip delete --resource-group $RG_NAME --name $PIP_NAME --no-wait
              done
              echo "Public IP deletions initiated..."
            fi

            # Wait for NICs and IPs to be deleted
            echo "Waiting for NICs and Public IPs to be deleted (30 seconds)..."
            sleep 30

            # Step 5: Delete ALL Network Security Groups
            echo "Deleting ALL Network Security Groups..."
            NSG_LIST=$(az network nsg list -g $RG_NAME --query "[].name" -o tsv)
            if [ ! -z "$NSG_LIST" ]; then
              for NSG_NAME in $NSG_LIST; do
                echo "Deleting NSG: $NSG_NAME"
                az network nsg delete --resource-group $RG_NAME --name $NSG_NAME --no-wait
              done
              echo "NSG deletions initiated..."
            fi

            # Step 6: Delete ALL Subnets (will be deleted with VNet, but list them)
            echo "Listing Subnets..."
            VNET_LIST=$(az network vnet list -g $RG_NAME --query "[].name" -o tsv)
            for VNET_NAME in $VNET_LIST; do
              echo "Found VNet: $VNET_NAME"
              SUBNET_LIST=$(az network vnet subnet list -g $RG_NAME --vnet-name $VNET_NAME --query "[].name" -o tsv 2>/dev/null || echo "")
              if [ ! -z "$SUBNET_LIST" ]; then
                echo "  Subnets: $SUBNET_LIST (will be deleted with VNet)"
              fi
            done

            # Wait for NSGs to be deleted
            echo "Waiting for NSGs to be deleted (20 seconds)..."
            sleep 20

            # Step 7: Delete ALL Virtual Networks
            echo "Deleting ALL Virtual Networks..."
            VNET_LIST=$(az network vnet list -g $RG_NAME --query "[].name" -o tsv)
            if [ ! -z "$VNET_LIST" ]; then
              for VNET_NAME in $VNET_LIST; do
                echo "Deleting VNet: $VNET_NAME"
                az network vnet delete --resource-group $RG_NAME --name $VNET_NAME --no-wait
              done
              echo "VNet deletions initiated..."
            fi

            # Step 8: Delete ALL Key Vaults
            echo "Deleting ALL Key Vaults..."
            KV_LIST=$(az keyvault list -g $RG_NAME --query "[].name" -o tsv)
            if [ ! -z "$KV_LIST" ]; then
              for KV_NAME in $KV_LIST; do
                echo "Deleting Key Vault: $KV_NAME"
                az keyvault delete --name $KV_NAME --resource-group $RG_NAME --no-wait

                # Purge the key vault to allow recreation with same name
                echo "Purging Key Vault: $KV_NAME..."
                az keyvault purge --name $KV_NAME --no-wait 2>/dev/null || echo "Key Vault purge initiated or already purged"
              done
            fi

            echo ""
            echo "Waiting for all deletions to complete (60 seconds)..."
            sleep 60

            # Step 9: Delete the entire resource group for clean slate
            echo "Deleting entire resource group for clean slate..."
            az group delete --name $RG_NAME --yes --no-wait

            # Wait for RG deletion
            echo "Waiting for resource group deletion (up to 3 minutes)..."
            for i in {1..36}; do
              if ! az group show --name $RG_NAME &>/dev/null; then
                echo "Resource group deleted successfully!"
                break
              fi
              echo "Still deleting... ($i/36)"
              sleep 5
            done

            echo ""
            echo "============================================"
            echo "Cleanup completed!"
            echo "============================================"
          else
            echo "Resource group '$RG_NAME' does not exist. Nothing to clean up."
          fi

      - name: Delete Resource Group (Optional - Full Clean)
        if: github.event.inputs.destroy_existing == 'true' && contains(github.event.head_commit.message, '[full-clean]')
        run: |
          echo "============================================"
          echo "FULL CLEAN: Ensuring resource group is deleted..."
          echo "============================================"

          RG_NAME="partfiniti-AI"

          if az group show --name $RG_NAME &>/dev/null; then
            echo "Resource group still exists, forcing deletion..."
            az group delete --name $RG_NAME --yes --no-wait

            echo "Waiting for resource group deletion to complete..."
            for i in {1..36}; do
              if ! az group show --name $RG_NAME &>/dev/null; then
                echo "Resource group deleted successfully!"
                break
              fi
              echo "Still deleting... ($i/36)"
              sleep 10
            done
          else
            echo "Resource group already deleted."
          fi

      - name: Terraform Init
        run: terraform init

      - name: Import Existing Resources (if any)
        run: |
          set +e

          echo "Attempting to import any remaining resources..."

          # Import Resource Group (if exists)
          if az group show --name partfiniti-AI &>/dev/null; then
            echo "Found existing resource group, importing..."
            terraform import azurerm_resource_group.rg \
              /subscriptions/<YOUR_AZURE_SUBSCRIPTION_ID>/resourceGroups/partfiniti-AI 2>/dev/null || true
          fi

          # Check if Key Vault exists and import
          KV_NAME=$(az keyvault list --resource-group partfiniti-AI --query "[0].name" -o tsv 2>/dev/null || echo "")
          if [ ! -z "$KV_NAME" ]; then
            echo "Found existing Key Vault: $KV_NAME"
            terraform import azurerm_key_vault.kv \
              /subscriptions/<YOUR_AZURE_SUBSCRIPTION_ID>/resourceGroups/partfiniti-AI/providers/Microsoft.KeyVault/vaults/$KV_NAME 2>/dev/null || true
          fi

          set -e

          echo "Import phase completed."
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Get Terraform Outputs
        id: tf_outputs
        run: |
          VM_IP=$(terraform output -raw vm_public_ip)
          KV_NAME=$(terraform output -raw key_vault_name)
          SSH_SECRET=$(terraform output -raw ssh_private_key_secret_name)

          echo "vm_ip=$VM_IP" >> $GITHUB_ENV
          echo "kv_name=$KV_NAME" >> $GITHUB_ENV
          echo "ssh_secret_name=$SSH_SECRET" >> $GITHUB_ENV

          echo "### Deployment Complete! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**VM Public IP:** \`$VM_IP\`" >> $GITHUB_STEP_SUMMARY
          echo "**Key Vault Name:** \`$KV_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "**SSH Key Secret:** \`$SSH_SECRET\`" >> $GITHUB_STEP_SUMMARY

      - name: Retrieve SSH Private Key from Key Vault
        run: |
          echo "Retrieving SSH private key from Key Vault..."

          mkdir -p ~/.ssh
          mkdir -p ./ssh-keys

          az keyvault secret show \
            --vault-name ${{ env.kv_name }} \
            --name ${{ env.ssh_secret_name }} \
            --query value -o tsv > ~/.ssh/llm_uat2_key

          chmod 600 ~/.ssh/llm_uat2_key
          echo "SSH private key saved to ~/.ssh/llm_uat2_key"

          cp ~/.ssh/llm_uat2_key ./ssh-keys/llm_uat2_key

          cat > ./ssh-keys/CONNECTION_INSTRUCTIONS.txt << EOF
          ============================================
          VM Connection Information
          ============================================

          VM Private IP: ${{ env.vm_ip }}
          Username: azureuser
          Key Vault: ${{ env.kv_name }}

          NOTE: This VM does not have a public IP address.
          You'll need to connect via:
          - Azure Bastion
          - VPN/ExpressRoute connection to the VNet
          - Jump box/Bastion host in the same VNet

          IMPORTANT: Set correct permissions on the SSH key after download:
            chmod 600 llm_uat2_key

          SSH Connection Command (from within VNet):
            ssh -i llm_uat2_key azureuser@${{ env.vm_ip }}

          ============================================
          EOF

          echo "SSH key and instructions prepared for download"

      - name: Upload SSH Key as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vm-ssh-key
          path: ./ssh-keys/
          retention-days: 7

      - name: Display Connection Information
        run: |
          echo "============================================"
          echo "VM Connection Information"
          echo "============================================"
          echo ""
          echo "VM Private IP: ${{ env.vm_ip }}"
          echo "Username: azureuser"
          echo "Key Vault: ${{ env.kv_name }}"
          echo ""
          echo "Download SSH key from Artifacts section"
          echo "============================================"

          echo "# VM Deployment Successful! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **VM Private IP** | \`${{ env.vm_ip }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Username** | \`azureuser\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Key Vault** | \`${{ env.kv_name }}\` |" >> $GITHUB_STEP_SUMMARY