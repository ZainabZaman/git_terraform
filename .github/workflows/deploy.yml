name: Deploy FastAPI

on:
  push:
    branches: [ "terraform_vm_deployment" ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Generate SSH Key
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t rsa -b 4096 -f ~/.ssh/id_rsa -N ""
          chmod 600 ~/.ssh/id_rsa
          chmod 644 ~/.ssh/id_rsa.pub
          cat ~/.ssh/id_rsa.pub

      - name: Terraform Init
        run: terraform init

      - name: Terraform Import Existing Resources
        run: |
          set +e
          # Import existing resources
          terraform import azurerm_resource_group.rg \
            /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/fastapi-rg || true

          terraform import azurerm_service_plan.plan \
            /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/fastapi-rg/providers/Microsoft.Web/serverFarms/fastapi-plan || true

          terraform import azurerm_key_vault.kv \
            /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/fastapi-rg/providers/Microsoft.KeyVault/vaults/fastapikv123 || true
          set -e
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Terraform Plan
        run: terraform plan
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Get VM IP
        run: |
          VM_IP=$(terraform output -raw vm_public_ip)
          echo "VM_IP=$VM_IP" >> $GITHUB_ENV
          echo "VM IP: $VM_IP"

      - name: Wait for VM to be ready
        run: |
          echo "Waiting for VM to be ready..."
          sleep 120  # Increased wait time

      - name: Test SSH Connection
        run: |
          echo "Testing SSH connection..."
          ssh-keyscan -H $VM_IP >> ~/.ssh/known_hosts 2>/dev/null || true

          # Test basic connectivity
          for i in {1..5}; do
            if ssh -i ~/.ssh/id_rsa -o ConnectTimeout=30 -o StrictHostKeyChecking=no azureuser@$VM_IP "echo 'SSH connection successful'"; then
              echo "SSH connection established"
              break
            else
              echo "SSH attempt $i failed, retrying in 30 seconds..."
              sleep 30
            fi
          done

      - name: Setup VM Dependencies
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no azureuser@$VM_IP << 'EOF'
            set -e
            echo "Starting VM setup..."

            # Update system
            sudo apt update -y
            sudo apt install -y python3 python3-pip git curl software-properties-common

            # Install Azure CLI
            curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

            # Login using VM's managed identity
            az login --identity

            # Install Python dependencies
            pip3 install --user fastapi uvicorn python-dotenv

            echo "VM setup completed"
          EOF

      - name: Deploy FastAPI Application
        run: |
          # Create FastAPI app content
          cat > main.py << 'EOF'
          import os
          from fastapi import FastAPI
          from dotenv import load_dotenv

          # Load environment variables
          load_dotenv()

          app = FastAPI(title="FastAPI on Azure VM", version="1.0.0")

          @app.get("/")
          async def root():
              return {"message": "Hello from FastAPI on Azure VM!"}

          @app.get("/health")
          async def health():
              return {"status": "healthy"}

          @app.get("/secret")
          async def get_secret():
              secret = os.getenv("MY_SECRET", "No secret found")
              return {"secret": secret}

          if __name__ == "__main__":
              import uvicorn
              uvicorn.run(app, host="0.0.0.0", port=8000)
          EOF

          # Create systemd service file
          cat > fastapi.service << 'EOF'
          [Unit]
          Description=FastAPI application
          After=network.target

          [Service]
          Type=simple
          User=azureuser
          WorkingDirectory=/home/azureuser/app
          Environment=PATH=/home/azureuser/.local/bin:/usr/bin:/bin
          ExecStart=/home/azureuser/.local/bin/uvicorn main:app --host 0.0.0.0 --port 8000
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
          EOF

          # Copy files to VM and setup service
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no main.py azureuser@$VM_IP:~/
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no fastapi.service azureuser@$VM_IP:~/

          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no azureuser@$VM_IP << 'EOF'
            set -e
            echo "Deploying FastAPI application..."

            # Create app directory
            mkdir -p /home/azureuser/app
            mv main.py /home/azureuser/app/

            # Get secret from Key Vault and create .env file
            SECRET_VALUE=$(az keyvault secret show --vault-name fastapikv123 --name new-secret --query value -o tsv)
            echo "MY_SECRET=$SECRET_VALUE" > /home/azureuser/app/.env

            # Setup systemd service
            sudo mv fastapi.service /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl enable fastapi
            sudo systemctl start fastapi

            echo "FastAPI deployment completed"
          EOF

      - name: Verify Deployment
        run: |
          echo "Waiting for FastAPI to start..."
          sleep 30

          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no azureuser@$VM_IP << 'EOF'
            # Check service status
            sudo systemctl status fastapi --no-pager

            # Test API endpoints
            echo "Testing API endpoints..."
            curl -f http://localhost:8000/ || echo "Root endpoint failed"
            curl -f http://localhost:8000/health || echo "Health endpoint failed"
          EOF

          echo "FastAPI is running at: http://$VM_IP:8000"
          echo "To check service status: ssh azureuser@$VM_IP 'sudo systemctl status fastapi'"
          echo "To view logs: ssh azureuser@$VM_IP 'sudo journalctl -u fastapi -f'"