name: Deploy VM Infrastructure

on:
  push:
    branches: [ "terraform_prod" ]
  workflow_dispatch:
    inputs:
      destroy_existing:
        description: 'Destroy existing resources before deployment'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Check Allowed Azure Regions
        run: |
          echo "Checking current resource group locations..."

          # Check if resource group exists
          RG_LOCATION=$(az group show --name Partfiniti-AI --query location -o tsv 2>/dev/null || echo "")
          if [ ! -z "$RG_LOCATION" ]; then
            echo "Found resource group 'Partfiniti-AI' in region: $RG_LOCATION"
            echo "AZURE_REGION=$RG_LOCATION" >> $GITHUB_ENV
          else
            echo "No existing resource group found. Will use eastasia as default."
            echo "AZURE_REGION=eastasia" >> $GITHUB_ENV
          fi

          echo "Selected Azure Region: $AZURE_REGION"

      - name: Clean Up Existing Deployments
        if: github.event.inputs.destroy_existing == 'true' || github.event_name == 'push'
        run: |
          echo "============================================"
          echo "Cleaning up existing resources..."
          echo "============================================"

          RG_NAME="Partfiniti-AI"
          if az group show --name $RG_NAME &>/dev/null; then
            echo "Resource group '$RG_NAME' exists. Proceeding with cleanup..."

            # Delete VM first (if exists) and WAIT for completion
            echo "Deleting Virtual Machine (if exists)..."
            VM_EXISTS=$(az vm list -g $RG_NAME --query "[?name=='LLM-1'].name" -o tsv)
            if [ ! -z "$VM_EXISTS" ]; then
              echo "Found VM: LLM-1. Deleting..."
              az vm delete --resource-group $RG_NAME --name LLM-1 --yes
              echo "VM deleted successfully!"

              # Additional wait to ensure Azure backend updates
              echo "Waiting for Azure to update resource dependencies (15 seconds)..."
              sleep 15
            else
              echo "No VM found named 'LLM-1'"
            fi

            # Delete Network Interface (if exists)
            echo "Deleting Network Interface (if exists)..."
            NIC_EXISTS=$(az network nic list -g $RG_NAME --query "[?name=='llm-1-nic'].name" -o tsv)
            if [ ! -z "$NIC_EXISTS" ]; then
              echo "Found NIC: llm-1-nic. Deleting..."
              az network nic delete --resource-group $RG_NAME --name llm-1-nic --no-wait
              echo "NIC deletion initiated..."
            fi

            # Delete Public IP (if exists)
            echo "Deleting Public IP (if exists)..."
            PIP_EXISTS=$(az network public-ip list -g $RG_NAME --query "[?name=='LLM-1-pip'].name" -o tsv)
            if [ ! -z "$PIP_EXISTS" ]; then
              echo "Found Public IP: LLM-1-pip. Deleting..."
              az network public-ip delete --resource-group $RG_NAME --name LLM-1-pip --no-wait
              echo "Public IP deletion initiated..."
            fi

            # Delete NSG (if exists)
            echo "Deleting Network Security Group (if exists)..."
            NSG_EXISTS=$(az network nsg list -g $RG_NAME --query "[?name=='partfiniti-ai-vm-nsg'].name" -o tsv)
            if [ ! -z "$NSG_EXISTS" ]; then
              echo "Found NSG: partfiniti-ai-vm-nsg. Deleting..."
              az network nsg delete --resource-group $RG_NAME --name partfiniti-ai-vm-nsg --no-wait
              echo "NSG deletion initiated..."
            fi

            # Delete Subnet (if exists and not in use)
            echo "Deleting Subnet (if exists)..."
            SUBNET_EXISTS=$(az network vnet subnet list -g $RG_NAME --vnet-name partfiniti-ai-vnet --query "[?name=='partfiniti-ai-subnet'].name" -o tsv 2>/dev/null || echo "")
            if [ ! -z "$SUBNET_EXISTS" ]; then
              echo "Found Subnet: partfiniti-ai-subnet. Will be deleted with VNet..."
            fi

            # Wait for network resources to be deleted
            echo "Waiting for network resources to be deleted (30 seconds)..."
            sleep 30

            # Delete VNet (if exists)
            echo "Deleting Virtual Network (if exists)..."
            VNET_EXISTS=$(az network vnet list -g $RG_NAME --query "[?name=='partfiniti-ai-vnet'].name" -o tsv)
            if [ ! -z "$VNET_EXISTS" ]; then
              echo "Found VNet: partfiniti-ai-vnet. Deleting..."
              az network vnet delete --resource-group $RG_NAME --name partfiniti-ai-vnet --no-wait
              echo "VNet deletion initiated..."
            fi

            # Delete Key Vault (if exists) - with purge protection handling
            echo "Deleting Key Vault (if exists)..."
            KV_LIST=$(az keyvault list -g $RG_NAME --query "[].name" -o tsv)
            for KV_NAME in $KV_LIST; do
              if [[ $KV_NAME == partfiniti-ai-kv-* ]]; then
                echo "Found Key Vault: $KV_NAME. Deleting..."
                az keyvault delete --name $KV_NAME --resource-group $RG_NAME --no-wait

                # Purge the key vault to allow recreation with same name
                echo "Purging Key Vault: $KV_NAME..."
                az keyvault purge --name $KV_NAME --no-wait 2>/dev/null || echo "Key Vault purge initiated or already purged"
              fi
            done

            echo ""
            echo "Waiting for all deletions to complete (60 seconds)..."
            sleep 60

            # Now delete the entire resource group to ensure clean slate
            echo "Deleting entire resource group for clean slate..."
            az group delete --name $RG_NAME --yes --no-wait

            # Wait for RG deletion
            echo "Waiting for resource group deletion (up to 2 minutes)..."
            for i in {1..24}; do
              if ! az group show --name $RG_NAME &>/dev/null; then
                echo "Resource group deleted successfully!"
                break
              fi
              echo "Still deleting... ($i/24)"
              sleep 5
            done

            echo ""
            echo "============================================"
            echo "Cleanup completed!"
            echo "============================================"
          else
            echo "Resource group '$RG_NAME' does not exist. Nothing to clean up."
          fi

      - name: Delete Resource Group (Optional - Full Clean)
        if: github.event.inputs.destroy_existing == 'true' && contains(github.event.head_commit.message, '[full-clean]')
        run: |
          echo "============================================"
          echo "FULL CLEAN: Deleting entire resource group..."
          echo "============================================"

          RG_NAME="Partfiniti-AI"

          if az group show --name $RG_NAME &>/dev/null; then
            echo "Deleting resource group: $RG_NAME"
            az group delete --name $RG_NAME --yes --no-wait

            echo "Waiting for resource group deletion to complete..."
            # Wait for resource group to be deleted (max 5 minutes)
            for i in {1..30}; do
              if ! az group show --name $RG_NAME &>/dev/null; then
                echo "Resource group deleted successfully!"
                break
              fi
              echo "Still deleting... ($i/30)"
              sleep 10
            done
          else
            echo "Resource group does not exist."
          fi

      - name: Terraform Init
        run: terraform init

      - name: Import Existing Resources (if any)
        run: |
          set +e

          echo "Attempting to import any remaining resources..."

          # Import Resource Group (if exists)
          if az group show --name Partfiniti-AI &>/dev/null; then
            echo "Found existing resource group, importing..."
            terraform import azurerm_resource_group.rg \
              /subscriptions/3c7f0ecb-9838-42e7-8964-2a82c3cc77ac/resourceGroups/Partfiniti-AI 2>/dev/null || true
          fi

          # Check if Key Vault exists and import
          KV_NAME=$(az keyvault list --resource-group Partfiniti-AI --query "[0].name" -o tsv 2>/dev/null || echo "")
          if [ ! -z "$KV_NAME" ]; then
            echo "Found existing Key Vault: $KV_NAME"
            terraform import azurerm_key_vault.kv \
              /subscriptions/3c7f0ecb-9838-42e7-8964-2a82c3cc77ac/resourceGroups/Partfiniti-AI/providers/Microsoft.KeyVault/vaults/$KV_NAME 2>/dev/null || true
          fi

          # Import VNet
          terraform import azurerm_virtual_network.vnet \
            /subscriptions/3c7f0ecb-9838-42e7-8964-2a82c3cc77ac/resourceGroups/Partfiniti-AI/providers/Microsoft.Network/virtualNetworks/partfiniti-ai-vnet 2>/dev/null || true

          # Import Subnet
          terraform import azurerm_subnet.subnet \
            /subscriptions/3c7f0ecb-9838-42e7-8964-2a82c3cc77ac/resourceGroups/Partfiniti-AI/providers/Microsoft.Network/virtualNetworks/partfiniti-ai-vnet/subnets/partfiniti-ai-subnet 2>/dev/null || true

          # Import NSG
          terraform import azurerm_network_security_group.nsg \
            /subscriptions/3c7f0ecb-9838-42e7-8964-2a82c3cc77ac/resourceGroups/Partfiniti-AI/providers/Microsoft.Network/networkSecurityGroups/partfiniti-ai-vm-nsg 2>/dev/null || true

          # Import Public IP
          terraform import azurerm_public_ip.pip \
            /subscriptions/3c7f0ecb-9838-42e7-8964-2a82c3cc77ac/resourceGroups/Partfiniti-AI/providers/Microsoft.Network/publicIPAddresses/LLM-1-pip 2>/dev/null || true

          # Import NIC
          terraform import azurerm_network_interface.nic \
            /subscriptions/3c7f0ecb-9838-42e7-8964-2a82c3cc77ac/resourceGroups/Partfiniti-AI/providers/Microsoft.Network/networkInterfaces/llm-1-nic 2>/dev/null || true

          # Import VM
          terraform import azurerm_linux_virtual_machine.vm \
            /subscriptions/3c7f0ecb-9838-42e7-8964-2a82c3cc77ac/resourceGroups/Partfiniti-AI/providers/Microsoft.Compute/virtualMachines/LLM-1 2>/dev/null || true

          set -e

          echo "Import phase completed."
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Get Terraform Outputs
        id: tf_outputs
        run: |
          VM_IP=$(terraform output -raw vm_public_ip)
          KV_NAME=$(terraform output -raw key_vault_name)
          SSH_SECRET=$(terraform output -raw ssh_private_key_secret_name)

          echo "vm_ip=$VM_IP" >> $GITHUB_ENV
          echo "kv_name=$KV_NAME" >> $GITHUB_ENV
          echo "ssh_secret_name=$SSH_SECRET" >> $GITHUB_ENV

          echo "### Deployment Complete! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**VM Public IP:** \`$VM_IP\`" >> $GITHUB_STEP_SUMMARY
          echo "**Key Vault Name:** \`$KV_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "**SSH Key Secret:** \`$SSH_SECRET\`" >> $GITHUB_STEP_SUMMARY

      - name: Retrieve SSH Private Key from Key Vault
        run: |
          echo "Retrieving SSH private key from Key Vault..."

          # Create .ssh directory if it doesn't exist
          mkdir -p ~/.ssh
          mkdir -p ./ssh-keys

          # Retrieve SSH private key
          az keyvault secret show \
            --vault-name ${{ env.kv_name }} \
            --name ${{ env.ssh_secret_name }} \
            --query value -o tsv > ~/.ssh/llm1_key

          chmod 600 ~/.ssh/llm1_key
          echo "SSH private key saved to ~/.ssh/llm1_key"

          # Copy to artifact directory for download
          cp ~/.ssh/llm1_key ./ssh-keys/llm1_key

          # Create connection instructions file
          cat > ./ssh-keys/CONNECTION_INSTRUCTIONS.txt << EOF
          ============================================
          VM Connection Information
          ============================================

          VM Public IP: ${{ env.vm_ip }}
          Username: gplaycock
          Key Vault: ${{ env.kv_name }}

          IMPORTANT: Set correct permissions on the SSH key after download:
            chmod 600 llm1_key

          SSH Connection Command:
            ssh -i llm1_key gplaycock@${{ env.vm_ip }}

          ============================================
          Additional Information
          ============================================

          To retrieve application secret from Key Vault:
            az keyvault secret show --vault-name ${{ env.kv_name }} --name app-secret --query value -o tsv

          To retrieve SSH key again from Key Vault:
            az keyvault secret show --vault-name ${{ env.kv_name }} --name ${{ env.ssh_secret_name }} --query value -o tsv > llm1_key
            chmod 600 llm1_key

          ============================================
          EOF

          echo "SSH key and instructions prepared for download"

      - name: Upload SSH Key as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vm-ssh-key
          path: ./ssh-keys/
          retention-days: 7

      - name: Test SSH Connection
        run: |
          echo "Testing SSH connection to VM..."
          ssh-keyscan -H ${{ env.vm_ip }} >> ~/.ssh/known_hosts 2>/dev/null

          # Test connection
          ssh -i ~/.ssh/llm1_key -o StrictHostKeyChecking=no gplaycock@${{ env.vm_ip }} "echo 'SSH connection successful!'"

      - name: Display Connection Information
        run: |
          echo "============================================"
          echo "VM Connection Information"
          echo "============================================"
          echo ""
          echo "VM Public IP: ${{ env.vm_ip }}"
          echo "Username: gplaycock"
          echo "Key Vault: ${{ env.kv_name }}"
          echo ""
          echo "DOWNLOAD SSH KEY:"
          echo "   Go to the Actions tab → This workflow run → Artifacts section"
          echo "   Download 'vm-ssh-key' artifact (available for 7 days)"
          echo ""
          echo "AFTER DOWNLOAD:"
          echo "   chmod 600 llm1_key"
          echo ""
          echo "SSH CONNECTION COMMAND:"
          echo "   ssh -i llm1_key gplaycock@${{ env.vm_ip }}"
          echo ""
          echo "============================================"

          # Create comprehensive GitHub Summary
          echo "# VM Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## VM Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **VM Public IP** | \`${{ env.vm_ip }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Username** | \`gplaycock\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Key Vault** | \`${{ env.kv_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **SSH Secret Name** | \`${{ env.ssh_secret_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Download SSH Key" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to the **Artifacts** section at the bottom of this workflow run" >> $GITHUB_STEP_SUMMARY
          echo "2. Download the \`vm-ssh-key\` artifact (contains SSH key and instructions)" >> $GITHUB_STEP_SUMMARY
          echo "3. Extract the downloaded file" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Important:** The artifact will be available for **7 days** only!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Connect to Your VM" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "After downloading the SSH key, run these commands:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# Set correct permissions (REQUIRED)" >> $GITHUB_STEP_SUMMARY
          echo "chmod 600 llm1_key" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Connect to VM" >> $GITHUB_STEP_SUMMARY
          echo "ssh -i llm1_key gplaycock@${{ env.vm_ip }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Alternative: Retrieve SSH Key from Key Vault" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "If you have Azure CLI configured, you can retrieve the key directly:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "az keyvault secret show --vault-name ${{ env.kv_name }} --name ${{ env.ssh_secret_name }} --query value -o tsv > llm1_key" >> $GITHUB_STEP_SUMMARY
          echo "chmod 600 llm1_key" >> $GITHUB_STEP_SUMMARY
          echo "ssh -i llm1_key gplaycock@${{ env.vm_ip }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Retrieve Application Secret" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "az keyvault secret show --vault-name ${{ env.kv_name }} --name app-secret --query value -o tsv" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Setup and Deploy Application (Optional)
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-app]')
        run: |
          echo "Deploying application to VM..."

          ssh -i ~/.ssh/llm1_key gplaycock@${{ env.vm_ip }} << 'EOF'
            # Update system
            sudo apt update -y
            sudo apt install -y python3 python3-pip git screen curl jq

            # Install Azure CLI
            curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

            # Get access token using managed identity
            ACCESS_TOKEN=$(curl -s -H "Metadata: true" \
              "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://vault.azure.net/" \
              | jq -r '.access_token')

            # Get secret from Key Vault
            SECRET_VALUE=$(curl -s -H "Authorization: Bearer $ACCESS_TOKEN" \
              "https://${{ env.kv_name }}.vault.azure.net/secrets/app-secret?api-version=2016-10-01" \
              | jq -r '.value')

            # Clone repository
            cd /home/gplaycock
            if [ -d "git_terraform" ]; then
              cd git_terraform
              git pull
            else
              git clone <YOUR_GIT_REPO_URL> # <-- UPDATE THIS TO YOUR GIT REPO URL
              cd git_terraform
            fi

            # Create .env file
            echo "MY_SECRET=$SECRET_VALUE" > .env

            # Install dependencies
            pip3 install fastapi uvicorn python-dotenv

            # Kill existing session if running
            screen -X -S fastapi_session quit 2>/dev/null || true

            # Start FastAPI in screen session
            screen -dmS fastapi_session bash -c 'cd /home/gplaycock/git_terraform && python3 -m uvicorn main:app --host 0.0.0.0 --port 8000'

            echo "Application deployed successfully!"
          EOF

          echo "Application should be available at: http://${{ env.vm_ip }}:8000"