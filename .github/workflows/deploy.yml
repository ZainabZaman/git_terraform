name: Deploy FastAPI

on:
  push:
    branches: [ "terraform_basic" ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Generate SSH Key
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t rsa -b 4096 -f ~/.ssh/id_rsa -N ""
          echo "SSH Public Key:"
          cat ~/.ssh/id_rsa.pub

      - name: Terraform Init
        run: terraform init

      - name: Check if Resource Group exists
        id: check_rg
        run: |
          if az group show --name fastapi-rg &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Resource Group already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Resource Group does not exist, will be created"
          fi

      - name: Import Resource Group (if exists)
        if: steps.check_rg.outputs.exists == 'true'
        run: |
          terraform import azurerm_resource_group_v2.rg \
            /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/fastapi-rg || true
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Check if Key Vault exists
        id: check_kv
        run: |
          if az keyvault show --name fastapikv123 &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Key Vault already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Key Vault does not exist, will be created"
          fi

      - name: Import Key Vault (if exists)
        if: steps.check_kv.outputs.exists == 'true'
        run: |
          terraform import azurerm_key_vault.kv \
            /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/fastapi-rg/providers/Microsoft.KeyVault/vaults/fastapikv123 || true
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Get Service Principal Object ID
        id: sp
        run: |
          OBJECT_ID=$(az ad sp list \
            --filter "appId eq '${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}'" \
            --query "[].id" -o tsv)
          echo "object_id=$OBJECT_ID" >> $GITHUB_ENV
          echo "Service Principal Object ID: $OBJECT_ID"

      - name: Import Key Vault Access Policy (if exists)
        if: steps.check_kv.outputs.exists == 'true'
        run: |
          terraform import azurerm_key_vault_access_policy.policy \
            "/subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/fastapi-rg/providers/Microsoft.KeyVault/vaults/fastapikv123/objectId/${{ env.object_id }}" || true
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Check and Import Virtual Network
        run: |
          if az network vnet show --resource-group fastapi-rg --name fastapi-vnet-test &>/dev/null; then
            echo "Virtual Network exists, importing..."
            terraform import azurerm_virtual_network.vnet \
              /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/fastapi-rg/providers/Microsoft.Network/virtualNetworks/fastapi-vnet-test || true
          fi
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Check and Import Subnet
        run: |
          if az network vnet subnet show --resource-group fastapi-rg --vnet-name fastapi-vnet-test --name fastapi-subnet &>/dev/null; then
            echo "Subnet exists, importing..."
            terraform import azurerm_subnet.subnet \
              /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/fastapi-rg/providers/Microsoft.Network/virtualNetworks/fastapi-vnet-test/subnets/fastapi-subnet || true
          fi
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Check and Import Public IP
        run: |
          if az network public-ip show --resource-group fastapi-rg --name fastapi-vm-ip &>/dev/null; then
            echo "Public IP exists, importing..."
            terraform import azurerm_public_ip.pip \
              /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/fastapi-rg/providers/Microsoft.Network/publicIPAddresses/fastapi-vm-ip || true
          fi
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Check and Import Network Security Group
        run: |
          if az network nsg show --resource-group fastapi-rg --name fastapi-nsg &>/dev/null; then
            echo "NSG exists, importing..."
            terraform import azurerm_network_security_group.nsg \
              /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/fastapi-rg/providers/Microsoft.Network/networkSecurityGroups/fastapi-nsg || true
          fi
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Check and Import Network Interface
        run: |
          if az network nic show --resource-group fastapi-rg --name fastapi-nic &>/dev/null; then
            echo "NIC exists, importing..."
            terraform import azurerm_network_interface.nic \
              /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/fastapi-rg/providers/Microsoft.Network/networkInterfaces/fastapi-nic || true
          fi
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Check and Import Virtual Machine
        run: |
          if az vm show --resource-group fastapi-rg --name terraform-test-v2 &>/dev/null; then
            echo "VM exists, importing..."
            terraform import azurerm_linux_virtual_machine.vm \
              /subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/fastapi-rg/providers/Microsoft.Compute/virtualMachines/terraform-test-v2 || true
          fi
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Check and Import VM Key Vault Access Policy
        run: |
          if az vm show --resource-group fastapi-rg --name terraform-test-v2 &>/dev/null; then
            VM_PRINCIPAL_ID=$(az vm identity show \
              --resource-group fastapi-rg \
              --name terraform-test-v2 \
              --query principalId -o tsv)
            if [ ! -z "$VM_PRINCIPAL_ID" ]; then
              terraform import azurerm_key_vault_access_policy.vm_policy \
                "/subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/fastapi-rg/providers/Microsoft.KeyVault/vaults/fastapikv123/objectId/$VM_PRINCIPAL_ID" || true
            fi
          fi
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Check and Import NSG Association
        run: |
          if az network vnet subnet show --resource-group fastapi-rg --vnet-name fastapi-vnet-test --name fastapi-subnet &>/dev/null; then
            SUBNET_ID="/subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/fastapi-rg/providers/Microsoft.Network/virtualNetworks/fastapi-vnet-test/subnets/fastapi-subnet"
            terraform import azurerm_subnet_network_security_group_association.nsg_association "$SUBNET_ID" || true
          fi
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Terraform Plan
        run: terraform plan
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Get Key Vault Credentials
        id: kv_creds
        run: |
          KV_URI=$(terraform output -raw key_vault_uri)
          KV_NAME=$(terraform output -raw key_vault_name)
          echo "key_vault_uri=$KV_URI" >> $GITHUB_OUTPUT
          echo "key_vault_name=$KV_NAME" >> $GITHUB_OUTPUT

      - name: Get VM Connection Details
        id: vm_details
        run: |
          VM_IP=$(terraform output -raw vm_public_ip)
          echo "vm_ip=$VM_IP" >> $GITHUB_OUTPUT

      - name: Save SSH Private Key
        run: |
          echo "Saving SSH private key to artifact..."
          cp ~/.ssh/id_rsa ./ssh_private_key.pem
          chmod 600 ./ssh_private_key.pem

      - name: Upload SSH Private Key
        uses: actions/upload-artifact@v3
        with:
          name: ssh-credentials
          path: ./ssh_private_key.pem
          retention-days: 7

      - name: Display Credentials Summary
        run: |
          echo "================================================"
          echo "           DEPLOYMENT CREDENTIALS"
          echo "================================================"
          echo ""
          echo "📦 RESOURCE GROUP:"
          echo "   Name: fastapi-rg"
          echo "   Location: East Asia"
          echo "   Status: ${{ steps.check_rg.outputs.exists == 'true' && 'Already Existed' || 'Newly Created' }}"
          echo ""
          echo "🔐 KEY VAULT CREDENTIALS:"
          echo "   Name: ${{ steps.kv_creds.outputs.key_vault_name }}"
          echo "   URI: ${{ steps.kv_creds.outputs.key_vault_uri }}"
          echo "   Status: ${{ steps.check_kv.outputs.exists == 'true' && 'Already Existed' || 'Newly Created' }}"
          echo ""
          echo "🖥️  VIRTUAL MACHINE ACCESS:"
          echo "   IP Address: ${{ steps.vm_details.outputs.vm_ip }}"
          echo "   Username: azureuser"
          echo "   SSH Command: ssh -i ssh_private_key.pem azureuser@${{ steps.vm_details.outputs.vm_ip }}"
          echo ""
          echo "📄 SSH PRIVATE KEY:"
          echo "   Download from: Actions > Artifacts > ssh-credentials"
          echo "   File: ssh_private_key.pem"
          echo ""
          echo "⚙️  USAGE INSTRUCTIONS:"
          echo "   1. Download the SSH private key from artifacts"
          echo "   2. Set permissions: chmod 600 ssh_private_key.pem"
          echo "   3. Connect to VM: ssh -i ssh_private_key.pem azureuser@${{ steps.vm_details.outputs.vm_ip }}"
          echo ""
          echo "🔑 KEY VAULT AUTHENTICATION:"
          echo "   Use Azure CLI: az login"
          echo "   Access secrets: az keyvault secret show --vault-name ${{ steps.kv_creds.outputs.key_vault_name }} --name <secret-name>"
          echo ""
          echo "================================================"